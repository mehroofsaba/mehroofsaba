<rect x="1.5" y="1.5" width="997" height="337" rx="22" fill="url(#card)" stroke="#3b3566" stroke-width="1.4"/><rect x="3" y="3" width="994" height="334" rx="20" fill="none" stroke="#f6cfdc" stroke-opacity=".06"/><clipPath id="cc"><rect x="1.5" y="1.5" width="997" height="337" rx="22"/></clipPath><circle clip-path="url(#cc)" cx="900" cy="40" r="220" fill="url(#pinkglow)"/><g transform="translate(36.0 36.0) rotate(10)"><path transform="rotate(0)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(72)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(144)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(216)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(288)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><circle r="1.8" fill="#d96a98"/><circle cx="3.1" cy="0.0" r="0.8" fill="#fff1b8"/><circle cx="0.8" cy="3.0" r="0.8" fill="#fff1b8"/><circle cx="-2.6" cy="1.6" r="0.8" fill="#fff1b8"/><circle cx="-2.2" cy="-2.1" r="0.8" fill="#fff1b8"/><circle cx="1.4" cy="-2.7" r="0.8" fill="#fff1b8"/></g><text x="58" y="44" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Marker Felt','Comic Sans MS','Comic Neue',cursive" font-size="24" fill="#f3e9dc" text-anchor="start" font-weight="600" textLength="180" lengthAdjust="spacingAndGlyphs">so... who am i?</text><path d="M252.0 36 q7 -5.0 14 0 q7 5.0 14 0 q7 -5.0 14 0 q7 5.0 14 0 q7 -5.0 14 0" fill="none" stroke="#e8a3c0" stroke-width="1.6" stroke-linecap="round" opacity=".85"/><text x="40" y="92" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">Hey! I'm Mehroof. I like turning random ideas into things I can</text><text x="40" y="119" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">actually click, break, rebuild, and occasionally finish.</text><text x="40" y="160" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">Right now most of that energy goes into Oneiric, a dark, dreamy</text><text x="40" y="187" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">personal space I'm building with Spring Boot, plus a few smaller</text><text x="40" y="214" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">experiments: a desktop companion, a puzzle game, a debugging helper.</text><text x="40" y="255" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">My GitHub bio says "The Bugs Fixes Me!!" and honestly, fair.</text><text x="40" y="304" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Marker Felt','Comic Sans MS','Comic Neue',cursive" font-size="19" fill="#e8a3c0" text-anchor="start" textLength="247" lengthAdjust="spacingAndGlyphs" font-style="italic">same brain, different day.</text><path transform="translate(309.0 297) scale(1.0)" d="M0 8 C-12 -2 -6 -10 0 -4 C6 -10 12 -2 0 8Z" fill="none" stroke="#e8a3c0" stroke-width="1.6" stroke-linejoin="round"/><g transform="translate(870 235) scale(1.25)"><path d="M-30 -14 L-26 -38 L-8 -24Z M30 -14 L26 -38 L8 -24Z" fill="#fbf3ea"/><path d="M-26 -17 L-24 -31 L-14 -23Z M26 -17 L24 -31 L14 -23Z" fill="#f6cfdc"/><ellipse cx="0" cy="0" rx="34" ry="28" fill="#fbf3ea"/><ellipse cx="-14" cy="-2" rx="3" ry="4" fill="#3a2b4d"/><ellipse cx="14" cy="-2" rx="3" ry="4" fill="#3a2b4d"/><circle cx="-13" cy="-3.5" r="1.1" fill="#fff"/><circle cx="15" cy="-3.5" r="1.1" fill="#fff"/><ellipse cx="-22" cy="8" rx="6" ry="3.5" fill="#e8a3c0" opacity=".55"/><ellipse cx="22" cy="8" rx="6" ry="3.5" fill="#e8a3c0" opacity=".55"/><path d="M-3 6 Q0 9 3 6 M0 9 Q-4 14 -7 11 M0 9 Q4 14 7 11" stroke="#3a2b4d" stroke-width="1.5" fill="none" stroke-linecap="round"/></g><path d="M830 292 q40 14 80 0" stroke="#b9a4e6" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M760 316 Q820 326 860.0 322.0 Q900 318 945.0 311.0 L990 304" fill="none" stroke="#4a3358" stroke-width="4" stroke-linecap="round"/><path d="M760 316 Q820 326 860.0 322.0 Q900 318 945.0 311.0 L990 304" fill="none" stroke="#c47a9b" stroke-opacity=".25" stroke-width="1" stroke-linecap="round" transform="translate(-.8 -.8)"/><g transform="translate(780.3 299.6) rotate(6)"><path transform="rotate(0)" d="M0 0 C-6.1 -3.9 -5.4 -10.3 0 -9.8 C5.4 -10.3 6.1 -3.9 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(72)" d="M0 0 C-6.1 -3.9 -5.4 -10.3 0 -9.8 C5.4 -10.3 6.1 -3.9 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(144)" d="M0 0 C-6.1 -3.9 -5.4 -10.3 0 -9.8 C5.4 -10.3 6.1 -3.9 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(216)" d="M0 0 C-6.1 -3.9 -5.4 -10.3 0 -9.8 C5.4 -10.3 6.1 -3.9 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(288)" d="M0 0 C-6.1 -3.9 -5.4 -10.3 0 -9.8 C5.4 -10.3 6.1 -3.9 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".3