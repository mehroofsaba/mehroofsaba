<rect x="1.5" y="1.5" width="997" height="359" rx="22" fill="url(#card)" stroke="#3b3566" stroke-width="1.4"/><rect x="3" y="3" width="994" height="356" rx="20" fill="none" stroke="#f6cfdc" stroke-opacity=".06"/><clipPath id="cc"><rect x="1.5" y="1.5" width="997" height="359" rx="22"/></clipPath><circle clip-path="url(#cc)" cx="900" cy="40" r="220" fill="url(#pinkglow)"/><g transform="translate(36.0 36.0) rotate(10)"><path transform="rotate(0)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(72)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(144)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(216)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><path transform="rotate(288)" d="M0 0 C-6.8 -4.4 -6.1 -11.6 0 -11.0 C6.1 -11.6 6.8 -4.4 0 0Z" fill="#e8a3c0" opacity="0.95" stroke="#f6cfdc" stroke-opacity=".35" stroke-width=".6"/><circle r="1.8" fill="#d96a98"/><circle cx="3.1" cy="0.0" r="0.8" fill="#fff1b8"/><circle cx="0.8" cy="3.0" r="0.8" fill="#fff1b8"/><circle cx="-2.6" cy="1.6" r="0.8" fill="#fff1b8"/><circle cx="-2.2" cy="-2.1" r="0.8" fill="#fff1b8"/><circle cx="1.4" cy="-2.7" r="0.8" fill="#fff1b8"/></g><text x="58" y="44" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Marker Felt','Comic Sans MS','Comic Neue',cursive" font-size="24" fill="#f3e9dc" text-anchor="start" font-weight="600" textLength="180" lengthAdjust="spacingAndGlyphs">so... who am i?</text><path d="M252.0 36 q7 -5.0 14 0 q7 5.0 14 0 q7 -5.0 14 0 q7 5.0 14 0 q7 -5.0 14 0" fill="none" stroke="#e8a3c0" stroke-width="1.6" stroke-linecap="round" opacity=".85"/><text x="40" y="92" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">Hey, I'm Mehroof. I like making interfaces that feel like</text><text x="40" y="119" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">actual little places rather than just... interfaces.</text><text x="40" y="160" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">Right now I'm mostly buried in Oneiric, a dark little space</text><text x="40" y="187" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">I'm building with Spring Boot. Somewhere along the way, I also</text><text x="40" y="214" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">decided I needed a desktop pet, a puzzle game, a debugging thing,</text><text x="40" y="241" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">and several other projects I probably did not need.</text><text x="40" y="282" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3e9dc" text-anchor="start" letter-spacing=".15">My bio defines me.</text><text x="40" y="331" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Marker Felt','Comic Sans MS','Comic Neue',cursive" font-size="19" fill="#e8a3c0" text-anchor="start" textLength="247" lengthAdjust="spacingAndGlyphs" font-style="italic">same brain, different day.</text><path transform="translate(309.0 324) scale(1.0)" d="M0 8 C-12 -2 -6 -10 0 -4 C6 -10 12 -2 0 8Z" fill="none" stroke="#e8a3c0" s